    margin-left: auto;

  }
  h1 {
    font-size: 22px;
    border-bottom: 3px solid #b5451b;
    padding-bottom: 8px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #6b5d52;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #e3d8ca;
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .card-header {
    padding: 12px 16px 4px 16px;
    background: #fdfaf6;
  }
  .card-header .name {
    font-weight: 600;
    font-size: 15px;
  }
  .card-header .meta {
    font-weight: 400;
    color: #6b5d52;
    font-size: 13px;
  }
  .shell-row {
    display: flex;
    gap: 18px;
    padding: 8px 16px 12px 16px;
    font-size: 13px;
    color: #4a3f37;
    background: #fdfaf6;
  }
  .shell-row div { flex: 1; }
  .shell-row .label { color: #8a7c6f; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .shell-row .val { font-size: 15px; font-weight: 600; color: #2b2320; }
  .whole-case { color: #b5451b; font-weight: 600; }
  details {
    border-top: 1px solid #f0e8dc;
  }
  summary {
    cursor: pointer;
    padding: 8px 16px;
    font-weight: 600;
    font-size: 12px;
    color: #b5451b;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  summary::-webkit-details-marker { display: none; }
  summary .arrow {
    transition: transform 0.15s ease;
    font-size: 11px;
    flex-shrink: 0;
  }
  details[open] summary .arrow { transform: rotate(90deg); }
  table.effects {
    width: calc(100% - 32px);
    margin: 0 16px 14px 16px;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.effects th, table.effects td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid #f0e8dc;
  }
  table.effects th {
    color: #8a7c6f;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
  }
  .chain-heading {
    padding: 10px 16px 4px 16px;
    font-size: 12px;
    font-weight: 700;
    color: #b5451b;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .chain-effects-list {
    padding: 0 16px 8px 16px;
    font-size: 12px;
    color: #6b5d52;
    line-height: 1.6;
  }
  .no-effects {
    padding: 0 16px 14px 16px;
    font-size: 13px;
    color: #a89a8c;
    font-style: italic;
  }
  table.effects td.effect-name { width: 60%; }
  .show-btns {
    display: flex;
    gap: 4px;
  }
  .show-btn {
    border: 1px solid #d8c9b8;
    background: #fdfaf6;
    color: #6b5d52;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
  }
  .show-btn:hover {
    border-color: #b5451b;
  }
  .qty-inputs {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .qty-field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .qty-field label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .qty-field.f-1 label { color: #b5451b; }
  .qty-field.f-2 label { color: #2b7a4b; }
  .qty-field.f-3 label { color: #2b5aa1; }
  .qty-field input {
    width: 44px;
    text-align: center;
    border: 1px solid #d8c9b8;
    border-radius: 5px;
    padding: 3px 2px;
    font-size: 13px;
    font-family: inherit;
  }
  .qty-field.f-1 input:focus { border-color: #b5451b; outline: none; }
  .qty-field.f-2 input:focus { border-color: #2b7a4b; outline: none; }
  .qty-field.f-3 input:focus { border-color: #2b5aa1; outline: none; }
  .qty-total {
    font-size: 11px;
    color: #8a7c6f;
    margin-left: 4px;
    white-space: nowrap;
  }
  .qty-total.balanced { color: #2b7a4b; font-weight: 700; }
  .qty-total.over { color: #b5451b; font-weight: 700; }
  .effects-tally {
    display: flex;
    gap: 16px;
    padding: 8px 16px 12px 16px;
    font-size: 12px;
    color: #6b5d52;
    border-top: 1px dashed #f0e8dc;
  }
  .effects-tally .tally-val { font-weight: 700; }
  .tally-1 .tally-val { color: #b5451b; }
  .tally-2 .tally-val { color: #2b7a4b; }
  .tally-3 .tally-val { color: #2b5aa1; }
  .summary-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 24px;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .summary-table th, .summary-table td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid #f0e8dc;
  }
  .summary-table th {
    background: #b5451b;
    color: #fff;
    font-size: 13px;
  }
  .summary-table td { font-size: 14px; }
  .summary-table tr:last-child td { font-weight: 700; background: #fdf0e8; }
  .section-title {
    margin-top: 30px;
    font-size: 17px;
    color: #b5451b;
  }
</style>

// assignments[itemIndex][effectIndex] = 1, 2, or 3 (or undefined)
const assignments = {};

function renderEffects(item, itemIndex, effectsContainer, tallyContainer) {
  effectsContainer.innerHTML = "";
  if (!item.effects && !item.chains) {
    const noEffects = document.createElement("div");
    noEffects.className = "no-effects";
    noEffects.textContent = "No itemized effects list provided yet.";
    effectsContainer.appendChild(noEffects);
    tallyContainer.style.display = "none";
    return;
  }

  // assignments[itemIndex][key] = array of show numbers, e.g. [1], [2,3], [1,2,3]
  // key is either an effect index (flat items) or "chainIdx-effectIdx" (chained items)
  if (!assignments[itemIndex]) assignments[itemIndex] = {};

  function parseQty(effectLabel) {
    const match = effectLabel.match(/\((\d+)\)\s*$/);
    return match ? parseInt(match[1], 10) : 1;
  }

  function getActiveShows(it) {
    const vals = [it.s1, it.s2, it.s3];
    const active = [];
    vals.forEach((v, idx) => {
      let numeric = 0;
      if (typeof v === "number") {
        numeric = v;
      } else if (typeof v === "string") {
        const trimmed = v.trim();
        if (trimmed !== "–" && trimmed !== "-") {
          const m = trimmed.match(/(\d+)/);
          numeric = m ? parseInt(m[1], 10) : 0;
        }
      }
      if (numeric > 0) active.push(idx + 1);
    });
    return active.length ? active : [1, 2, 3];
  }

  function evenSplit(total) {
    const active = getActiveShows(item);
    const n = active.length;
    const base = Math.floor(total / n);
    const remainder = total % n;
    const result = {1:0, 2:0, 3:0};
    active.forEach((showNum, i) => {
      result[showNum] = base + (i < remainder ? 1 : 0);
    });
    return result;
  }

  function buildRow(table, key, effectLabel, numberLabel) {
    const tr = document.createElement("tr");

    if (numberLabel !== undefined) {
      const tdNum = document.createElement("td");
      tdNum.textContent = numberLabel;
      tr.appendChild(tdNum);
    }

    const tdName = document.createElement("td");
    tdName.className = "effect-name";
    tdName.textContent = effectLabel;
    tr.appendChild(tdName);

    const tdBtns = document.createElement("td");
    const totalQty = parseQty(effectLabel);
    if (!assignments[itemIndex][key]) {
      assignments[itemIndex][key] = evenSplit(totalQty);
    }
    const current = assignments[itemIndex][key];

    const wrap = document.createElement("div");
    wrap.className = "qty-inputs";

    [1, 2, 3].forEach(showNum => {
      const field = document.createElement("div");
      field.className = "qty-field f-" + showNum;
      const label = document.createElement("label");
      label.textContent = SHOW_NAMES[showNum];
      const input = document.createElement("input");
      input.type = "number";
      input.min = "0";
      input.value = current[showNum] || 0;
      input.addEventListener("input", () => {
        const live = assignments[itemIndex][key];
        live[showNum] = Math.max(0, parseInt(input.value, 10) || 0);
        updateTotalLabel();
        updateTally();
      });
      field.appendChild(label);
      field.appendChild(input);
      wrap.appendChild(field);
    });

    const totalLabel = document.createElement("span");
    totalLabel.className = "qty-total";
    function updateTotalLabel() {
      const c = assignments[itemIndex][key] || {1:0,2:0,3:0};
      const sum = (c[1]||0) + (c[2]||0) + (c[3]||0);
      totalLabel.textContent = `${sum} / ${totalQty}`;
      totalLabel.classList.remove("balanced", "over");
      if (sum === totalQty) totalLabel.classList.add("balanced");
      else if (sum > totalQty) totalLabel.classList.add("over");
    }
    updateTotalLabel();
    wrap.appendChild(totalLabel);

    tdBtns.appendChild(wrap);
    tr.appendChild(tdBtns);
    table.appendChild(tr);
  }

  function updateTally() {
    const counts = {1:0, 2:0, 3:0};
    Object.values(assignments[itemIndex]).forEach(c => {
      counts[1] += c[1] || 0;
      counts[2] += c[2] || 0;
      counts[3] += c[3] || 0;
    });
    tallyContainer.innerHTML = `
      <div class="tally-1">${SHOW_NAMES[1]}: <span class="tally-val">${counts[1]}</span> shells</div>
      <div class="tally-2">${SHOW_NAMES[2]}: <span class="tally-val">${counts[2]}</span> shells</div>
      <div class="tally-3">${SHOW_NAMES[3]}: <span class="tally-val">${counts[3]}</span> shells</div>
    `;
  }

  if (item.chains) {
    // total physical chains across the whole item = sum of "N chains" parsed from s1/s2/s3
    function parseChainCount(v) {
      if (typeof v !== "string") return 0;
      const m = v.match(/(\d+)\s*chain/);
      return m ? parseInt(m[1], 10) : 0;
    }
    const totalChains = parseChainCount(item.s1) + parseChainCount(item.s2) + parseChainCount(item.s3);
    const qtyPerDesign = item.chains.length ? totalChains / item.chains.length : 0;
    const activeShowsForChains = getActiveShows(item);

    function chainDefaultSplit(total, offset) {
      const result = {1:0, 2:0, 3:0};
      let remaining = total;
      let idx = offset % activeShowsForChains.length;
      while (remaining > 0) {
        const show = activeShowsForChains[idx % activeShowsForChains.length];
        result[show]++;
        remaining--;
        idx++;
      }
      return result;
    }

    item.chains.forEach((chain, chainIdx) => {
      const chainHeading = document.createElement("div");
      chainHeading.className = "chain-heading";
      chainHeading.textContent = chain.label + " (whole chain — assign as one unit)";
      effectsContainer.appendChild(chainHeading);

      const list = document.createElement("div");
      list.className = "chain-effects-list";
      list.innerHTML = chain.effects.map((e, i) => `<div>${i + 1}. ${e}</div>`).join("");
      effectsContainer.appendChild(list);

      const table = document.createElement("table");
      table.className = "effects";
      table.innerHTML = `<tr><th>Chain</th><th>Assign chains to Show</th></tr>`;
      const chainKey = `chain-${chainIdx}`;
      if (!assignments[itemIndex][chainKey]) {
        assignments[itemIndex][chainKey] = chainDefaultSplit(qtyPerDesign, chainIdx);
      }
      buildRow(table, chainKey, `${chain.label} (${qtyPerDesign})`);
      effectsContainer.appendChild(table);
    });
  } else {
    const table = document.createElement("table");
    table.className = "effects";
    table.innerHTML = `<tr><th>#</th><th>Effect</th><th>Assign to Show</th></tr>`;
    item.effects.forEach((effect, i) => {
      buildRow(table, i, effect, i + 1);
    });
    effectsContainer.appendChild(table);
  }

  tallyContainer.style.display = "flex";
  updateTally();
}

items.forEach((item, itemIndex) => {
  const card = document.createElement("div");
  card.className = "card";

  const header = document.createElement("div");
  header.className = "card-header";
  header.innerHTML = `
    <div class="name">${item.name}</div>
    <div class="meta">${item.caseSize} case &nbsp;•&nbsp; ${item.cps}/shell</div>
  `;
  card.appendChild(header);

  const shellRow = document.createElement("div");
  shellRow.className = "shell-row";
  ["s1","s2","s3"].forEach((key, i) => {
    const val = item[key];
    const isWhole = typeof val === "string" && val.includes("whole case");
    const div = document.createElement("div");
    div.innerHTML = `<div class="label">${SHOW_NAMES[i+1]}</div><div class="val ${isWhole ? 'whole-case' : ''}">${val}</div>`;
    shellRow.appendChild(div);
  });
  card.appendChild(shellRow);

  const details = document.createElement("details");
  const summary = document.createElement("summary");
  summary.innerHTML = `<span class="arrow">&#9654;</span> Effects`;
  details.appendChild(summary);

  const effectsContainer = document.createElement("div");
  const tallyContainer = document.createElement("div");
  tallyContainer.className = "effects-tally";

  details.appendChild(effectsContainer);
  details.appendChild(tallyContainer);

  renderEffects(item, itemIndex, effectsContainer, tallyContainer);

  card.appendChild(details);
  container.appendChild(card);
});
</script>

</body>
</html>
